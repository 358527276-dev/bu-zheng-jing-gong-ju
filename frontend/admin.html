<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 不正经工具箱</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-container" id="adminApp">
    
    <!-- 登录页 -->
    <div id="loginPage" class="admin-login">
      <h2>🔐 管理后台</h2>
      <input type="password" id="adminPassword" placeholder="请输入管理员密码">
      <button onclick="adminLogin()">登录</button>
      <p style="margin-top: 16px; font-size: 12px; color: #9ca3af;">默认密码：admin123</p>
    </div>
    
    <!-- 管理面板 -->
    <div id="dashboardPage" style="display:none;">
      <div class="admin-header">
        <h1>📊 数据概览</h1>
        <button onclick="adminLogout()" style="padding:8px 16px; border:none; background:#f3f4f6; border-radius:8px; cursor:pointer; font-size:14px;">退出</button>
      </div>
      
      <!-- 统计卡片 -->
      <div class="admin-stats" id="statsCards">
        <div class="admin-stat-card blue">
          <div class="stat-value" id="statUsers">0</div>
          <div class="stat-label">总用户数</div>
        </div>
        <div class="admin-stat-card green">
          <div class="stat-value" id="statIncome">¥0</div>
          <div class="stat-label">累计收入</div>
        </div>
        <div class="admin-stat-card purple">
          <div class="stat-value" id="statTodayIncome">¥0</div>
          <div class="stat-label">今日收入</div>
        </div>
        <div class="admin-stat-card orange">
          <div class="stat-value" id="statPending">0</div>
          <div class="stat-label">待审核订单</div>
        </div>
      </div>
      
      <!-- 订单筛选Tab -->
      <div class="admin-tabs">
        <button class="admin-tab active" data-status="" onclick="switchTab(this, '')">全部</button>
        <button class="admin-tab" data-status="0" onclick="switchTab(this, 0)">待支付</button>
        <button class="admin-tab" data-status="1" onclick="switchTab(this, 1)">已完成</button>
        <button class="admin-tab" data-status="2" onclick="switchTab(this, 2)">已取消</button>
        <button class="admin-tab" data-status="3" onclick="switchTab(this, 3)">已超时</button>
        <button style="margin-left:auto; padding:8px 16px; background:#8b5cf6; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:13px;" onclick="loadOrders()">🔄 刷新</button>
      </div>
      
      <!-- 订单列表 -->
      <div class="admin-table">
        <table>
          <thead>
            <tr>
              <th>订单号</th>
              <th>用户</th>
              <th>类型</th>
              <th>金额</th>
              <th>支付方式</th>
              <th>状态</th>
              <th>下单时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="orderTbody">
            <tr><td colspan="8" style="text-align:center; padding:30px; color:#9ca3af;">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  
  <script>
    const API_BASE = '/api';
    let currentStatus = '';
    let isAdminLoggedIn = false;
    let lastPendingCount = 0;
    
    // 获取鉴权header
    function authHeaders() {
      const token = localStorage.getItem('admin_token');
      return {
        'Content-Type': 'application/json',
        'X-Admin-Token': token || ''
      };
    }
    
    // 检查登录状态
    function checkLogin() {
      const token = localStorage.getItem('admin_token');
      if (token) {
        isAdminLoggedIn = true;
        showDashboard();
      }
    }
    
    // 登录
    async function adminLogin() {
      const pwd = document.getElementById('adminPassword').value;
      if (!pwd) {
        alert('请输入密码');
        return;
      }
      
      try {
        const res = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        const data = await res.json();
        
        if (data.code === 0) {
          localStorage.setItem('admin_token', data.data.token);
          isAdminLoggedIn = true;
          showDashboard();
        } else {
          alert(data.message || '登录失败');
        }
      } catch (e) {
        alert('网络错误');
      }
    }
    
    // 退出
    function adminLogout() {
      localStorage.removeItem('admin_token');
      isAdminLoggedIn = false;
      document.getElementById('loginPage').style.display = 'block';
      document.getElementById('dashboardPage').style.display = 'none';
    }
    
    // 显示后台面板
    function showDashboard() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('dashboardPage').style.display = 'block';
      loadStats();
      loadOrders();
      
      // 自动刷新（30秒）
      setInterval(() => {
        if (isAdminLoggedIn) {
          loadStats();
          if (currentStatus === '' || currentStatus === 0) {
            loadOrders();
          }
        }
      }, 30000);
    }
    
    // 切换Tab
    function switchTab(el, status) {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      currentStatus = status;
      loadOrders();
    }
    
    // 加载统计
    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/admin/stats`, {
          headers: authHeaders()
        });
        const data = await res.json();
        
        if (data.code === 0) {
          const s = data.data;
          document.getElementById('statUsers').textContent = s.totalUsers;
          document.getElementById('statIncome').textContent = '¥' + s.totalIncome.toFixed(2);
          document.getElementById('statTodayIncome').textContent = '¥' + s.todayIncome.toFixed(2);
          document.getElementById('statPending').textContent = s.pendingCount;
          
          // 新订单提醒（声音+标题闪烁）
          if (lastPendingCount > 0 && s.pendingCount > lastPendingCount) {
            playNotificationSound();
            flashTitle();
          }
          lastPendingCount = s.pendingCount;
        } else if (data.code === 401) {
          adminLogout();
        }
      } catch (e) {
        console.error('加载统计失败', e);
      }
    }
    
    // 加载订单列表
    async function loadOrders() {
      const tbody = document.getElementById('orderTbody');
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:30px; color:#9ca3af;">加载中...</td></tr>';
      
      try {
        const params = new URLSearchParams();
        if (currentStatus !== '' && currentStatus !== null) params.set('status', currentStatus);
        params.set('pageSize', '50');
        
        const res = await fetch(`${API_BASE}/admin/orders?${params.toString()}`, {
          headers: authHeaders()
        });
        const data = await res.json();
        
        if (data.code === 0) {
          renderOrders(data.data.list);
        } else if (data.code === 401) {
          adminLogout();
        } else {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:#ef4444;">${data.message || '加载失败'}</td></tr>`;
        }
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:30px; color:#ef4444;">网络错误</td></tr>';
      }
    }
    
    // 渲染订单
    function renderOrders(orders) {
      const tbody = document.getElementById('orderTbody');
      
      if (!orders || orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:30px; color:#9ca3af;">暂无订单</td></tr>';
        return;
      }
      
      const typeMap = { recharge: '余额充值', vip: '会员购买' };
      const payMap = { wechat: '💚 微信', alipay: '💙 支付宝' };
      const statusMap = {
        0: { text: '待支付', cls: 'pending' },
        1: { text: '已完成', cls: 'success' },
        2: { text: '已取消', cls: 'cancel' },
        3: { text: '已超时', cls: 'expired' }
      };
      
      tbody.innerHTML = orders.map(o => {
        const st = statusMap[o.status] || statusMap[0];
        const typeName = o.type === 'vip' && o.vip_type 
          ? `会员(${vipTypeName(o.vip_type)})` 
          : typeMap[o.type] || o.type;
        
        let actionBtns = '';
        if (o.status === 0) {
          actionBtns = `<button class="admin-btn primary" onclick="confirmOrder(${o.id})">确认到账</button>`;
        }
        
        return `
          <tr>
            <td style="font-size:12px; font-family:monospace;">${o.order_no}</td>
            <td>${o.user_name || '用户' + o.user_id}</td>
            <td>${typeName}</td>
            <td style="font-weight:600; color:#ef4444;">¥${o.amount.toFixed(2)}</td>
            <td>${payMap[o.pay_method] || o.pay_method}</td>
            <td><span class="admin-status ${st.cls}">${st.text}</span></td>
            <td style="font-size:12px; color:#6b7280;">${formatTime(o.created_at)}</td>
            <td>${actionBtns}</td>
          </tr>
        `;
      }).join('');
    }
    
    function vipTypeName(type) {
      const map = { monthly: '月卡', quarterly: '季卡', yearly: '年卡', lifetime: '终身卡' };
      return map[type] || type;
    }
    
    function formatTime(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
    
    // 确认到账
    async function confirmOrder(orderId) {
      if (!confirm('确认已经收到款项了吗？确认后将自动加余额/开会员。')) return;
      
      try {
        const res = await fetch(`${API_BASE}/admin/confirm`, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ orderId })
        });
        const data = await res.json();
        
        if (data.code === 0) {
          alert('确认成功！');
          loadStats();
          loadOrders();
        } else if (data.code === 401) {
          adminLogout();
        } else {
          alert(data.message || '操作失败');
        }
      } catch (e) {
        alert('网络错误');
      }
    }
    
    // 新订单声音提醒（用Web Audio API生成提示音）
    let audioCtx = null;
    function playNotificationSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }
    
    // 标题闪烁提醒
    let flashTimer = null;
    let originalTitle = document.title;
    function flashTitle() {
      if (flashTimer) return;
      let count = 0;
      flashTimer = setInterval(() => {
        document.title = count % 2 === 0 ? '🔔 新订单！' : originalTitle;
        count++;
        if (count > 10) {
          clearInterval(flashTimer);
          flashTimer = null;
          document.title = originalTitle;
        }
      }, 500);
    }
    
    // 页面获得焦点时停止闪烁
    window.addEventListener('focus', () => {
      if (flashTimer) {
        clearInterval(flashTimer);
        flashTimer = null;
        document.title = originalTitle;
      }
    });
    
    // 回车登录
    document.getElementById('adminPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') adminLogin();
    });
    
    // 初始化
    checkLogin();
  </script>
</body>
</html>
