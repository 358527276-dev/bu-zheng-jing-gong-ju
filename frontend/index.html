<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>不正经工具箱 - 17个AI趣味工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #8e44ad;
      --primary-light: #c084fc;
      --pink: #ff6b9d;
      --gold: #d4a574;
      --bg-1: #fff0f5;
      --bg-2: #fce4ec;
      --bg-3: #f3e5f5;
      --bg-4: #ede7f6;
      --text: #3c2a3e;
      --text-light: #6b4458;
      --card-bg: rgba(255, 255, 255, 0.92);
      --border: rgba(212, 165, 116, 0.2);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 20%, var(--bg-3) 50%, var(--bg-4) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 80px;
    }

    .sakura-layer { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
    .sakura {
      position: absolute; width: 16px; height: 16px;
      background: radial-gradient(circle, #ffb7c5 40%, #ff8fa3 70%, transparent 71%);
      border-radius: 50% 0 50% 0;
      animation: fall 8s linear infinite;
      opacity: 0.6;
    }
    @keyframes fall {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.5; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    .container { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; }

    .hero {
      background: linear-gradient(135deg, #4a235a 0%, #7b2d8e 30%, #c084fc 70%, #ff6b9d 100%);
      color: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      margin-bottom: 16px;
      box-shadow: 0 12px 32px rgba(123, 45, 142, 0.4);
      border: 2px solid rgba(244, 208, 63, 0.3);
      position: relative;
      overflow: hidden;
    }
    .hero-title { font-size: 26px; font-weight: 900; letter-spacing: 2px; }
    .hero-sub { font-size: 13px; opacity: 0.9; margin-top: 4px; }
    .hero-free { margin-top: 12px; font-size: 13px; }
    .wechat-login-btn {
      margin-top: 16px; padding: 10px 20px; border-radius: 20px;
      background: #07c160; color: #fff; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .wechat-login-btn:hover { background: #06ad56; }
    .user-info-display {
      margin-top: 12px; font-size: 13px; opacity: 0.9;
      display: flex; align-items: center; gap: 8px;
    }
    .user-info-display img {
      width: 24px; height: 24px; border-radius: 50%;
    }
    .miniprogram-btn {
      margin-top: 12px; padding: 10px 20px; border-radius: 20px;
      background: linear-gradient(135deg, #07c160, #06ad56);
      color: #fff; border: none; font-size: 14px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .miniprogram-btn:hover { opacity: 0.9; }

    /* 小程序码弹窗 */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 1000;
      justify-content: center; align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #fff; border-radius: 20px; padding: 32px;
      max-width: 360px; text-align: center; position: relative;
    }
    .modal-close {
      position: absolute; top: 12px; right: 12px;
      width: 32px; height: 32px; border-radius: 50%;
      background: #f3f4f6; border: none; font-size: 20px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
    .modal-desc { font-size: 14px; color: var(--text-light); margin-bottom: 20px; line-height: 1.6; }
    .qrcode-placeholder {
      width: 200px; height: 200px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #9ca3af; border: 2px dashed #d1d5db;
    }
    .modal-tips {
      font-size: 12px; color: #9ca3af; margin-top: 16px;
      padding: 12px; background: #f9fafb; border-radius: 8px;
    }

    .cat-bar {
      display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px;
      padding-bottom: 4px; scrollbar-width: none;
    }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-item {
      padding: 8px 16px; border-radius: 999px;
      background: rgba(255,255,255,0.7); color: var(--text-light);
      font-size: 13px; font-weight: 500; white-space: nowrap;
      border: 2px solid transparent; cursor: pointer;
    }
    .cat-item.active {
      background: linear-gradient(135deg, #fce4ec, #f3e5f5);
      color: var(--primary); border-color: var(--gold); font-weight: 700;
    }

    .grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .tool-card {
      width: calc(50% - 6px);
      background: var(--card-bg);
      border-radius: 16px; padding: 16px;
      box-shadow: 0 4px 16px rgba(124,58,90,0.08);
      border: 1px solid var(--border);
      position: relative; overflow: hidden; cursor: pointer;
    }
    .tool-card:active { transform: scale(0.97); }
    .tool-card.vip { background: linear-gradient(180deg, #fff9ec 0%, rgba(255,255,255,0.92) 40%); border-color: var(--gold-light); }
    .tool-icon-bg {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px; overflow: hidden;
    }
    .tool-icon-img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
    .tool-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .tool-desc { font-size: 11px; color: var(--text-light); line-height: 1.4; height: 32px; overflow: hidden; }
    .tool-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .tool-price { font-size: 11px; font-weight: 700; color: #1b5e20; }
    .tool-price.vip { color: #7a4a00; }
    .tool-count { font-size: 10px; color: #d1b3c0; }

    .tabbar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background: rgba(255,255,255,0.95); border-top: 1px solid var(--border);
      display: flex; z-index: 100;
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 11px; color: #999; cursor: pointer; gap: 2px;
    }
    .tab-item.active { color: var(--primary); }
    .tab-icon { font-size: 20px; }

    /* 工具详情页 */
    .tool-detail { display: none; }
    .tool-detail.active { display: block; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 8px 16px; background: rgba(255,255,255,0.8);
      border-radius: 20px; font-size: 14px; cursor: pointer;
      margin-bottom: 16px; border: 1px solid var(--border);
    }
    .tool-header {
      background: var(--card-bg);
      border-radius: 20px; padding: 24px;
      text-align: center; margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .tool-header-icon {
      width: 80px; height: 80px; border-radius: 20px;
      margin: 0 auto 12px; overflow: hidden;
    }
    .tool-header-icon img { width: 100%; height: 100%; object-fit: cover; }
    .tool-header-name { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .tool-header-desc { font-size: 13px; color: var(--text-light); line-height: 1.6; }
    .tool-header-meta { margin-top: 12px; display: flex; justify-content: center; gap: 12px; }
    .tool-tag {
      padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600;
    }
    .tag-free { background: #d1fae5; color: #059669; }
    .tag-vip { background: #fef3c7; color: #92400e; }

    .form-card {
      background: var(--card-bg);
      border-radius: 20px; padding: 24px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .form-card-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: block; }
    .form-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .form-option {
      padding: 8px 16px; border-radius: 20px;
      background: rgba(255,255,255,0.8); border: 2px solid transparent;
      font-size: 13px; cursor: pointer;
    }
    .form-option.active {
      background: linear-gradient(135deg, #fce4ec, #f3e5f5);
      border-color: var(--gold); color: var(--primary); font-weight: 600;
    }
    .form-input, .form-textarea {
      width: 100%; padding: 12px; border-radius: 12px;
      border: 2px solid var(--border); font-size: 14px;
      background: rgba(255,255,255,0.8);
    }
    .form-textarea { min-height: 80px; resize: vertical; }

    .btn-generate {
      width: 100%; padding: 16px; border-radius: 30px;
      background: linear-gradient(135deg, #ff6b9d 0%, #c084fc 50%, #60a5fa 100%);
      color: #fff; font-size: 16px; font-weight: 700;
      border: none; cursor: pointer; margin-top: 16px;
      box-shadow: 0 8px 24px rgba(192, 132, 252, 0.4);
    }
    .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 结果页 */
    .result-page { display: none; }
    .result-page.active { display: block; }
    .result-card {
      background: var(--card-bg);
      border-radius: 20px; padding: 24px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .result-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; text-align: center; }
    .result-content { font-size: 14px; line-height: 1.8; }
    .result-section { margin-bottom: 20px; }
    .result-section-title { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
    .result-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px; background: rgba(255,255,255,0.6); border-radius: 12px; margin-bottom: 8px; }
    .result-item-index { font-size: 12px; font-weight: 700; color: var(--primary); min-width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #fce4ec, #f3e5f5); border-radius: 50%; }
    .result-item-text { flex: 1; font-size: 14px; line-height: 1.6; word-break: break-word; }
    .btn-copy-item { padding: 6px 12px; border-radius: 16px; background: rgba(255,255,255,0.9); border: 1px solid var(--border); font-size: 12px; cursor: pointer; white-space: nowrap; }
    .btn-copy-item:active { background: var(--primary); color: #fff; }
    .result-actions { display: flex; gap: 12px; margin-top: 16px; }
    .btn-action {
      flex: 1; padding: 12px; border-radius: 20px;
      background: rgba(255,255,255,0.8); border: 2px solid var(--border);
      font-size: 14px; font-weight: 600; cursor: pointer;
    }

    /* 加载和错误 */
    .loading, .error {
      text-align: center; padding: 60px 20px; color: var(--text-light);
    }
    .loading-icon { font-size: 48px; margin-bottom: 16px; }
    .retry-btn {
      margin-top: 16px; padding: 10px 24px; border-radius: 20px;
      background: var(--primary); color: #fff; border: none; cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="sakura-layer">
    <div class="sakura" style="left:10%; animation-delay:0s; animation-duration:9s;"></div>
    <div class="sakura" style="left:25%; animation-delay:2s; animation-duration:11s;"></div>
    <div class="sakura" style="left:45%; animation-delay:4s; animation-duration:8s;"></div>
    <div class="sakura" style="left:65%; animation-delay:1s; animation-duration:10s;"></div>
    <div class="sakura" style="left:80%; animation-delay:3s; animation-duration:12s;"></div>
  </div>

  <div class="container">
    <!-- 首页 -->
    <div id="pageHome" class="page active">
      <div class="hero">
        <div class="hero-title">🤪 不正经工具箱</div>
        <div class="hero-sub">17个上头AI小玩具 · 看广告白嫖</div>
        <div class="hero-free">
          <span>🎁 今日免费 <b id="dailyFree">0</b> 次</span>
          <span style="margin:0 6px;opacity:0.6;">·</span>
          <span>赠送 <b id="giftFree">0</b> 次</span>
        </div>
        <div id="loginArea">
          <button class="wechat-login-btn" onclick="wechatLogin()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.045c.134 0 .24-.11.24-.245 0-.06-.024-.12-.04-.178l-.325-1.233a.492.492 0 0 1 .177-.554C23.074 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.269-.03-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982z"/></svg>
            微信登录
          </button>
          <button class="miniprogram-btn" onclick="showMiniProgramQR()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            使用小程序
          </button>
          <div class="user-info-display" id="userInfoDisplay" style="display:none;">
            <img id="userAvatar" src="" alt="">
            <span id="userName"></span>
          </div>
        </div>
      </div>

      <div class="cat-bar" id="catBar"></div>
      <div class="grid" id="toolGrid"></div>
    </div>

    <!-- 工具详情页 -->
    <div id="pageTool" class="tool-detail">
      <div class="back-btn" onclick="goHome()">← 返回</div>
      <div class="tool-header">
        <div class="tool-header-icon"><img id="toolIcon" src="" alt=""></div>
        <div class="tool-header-name" id="toolName"></div>
        <div class="tool-header-desc" id="toolDesc"></div>
        <div class="tool-header-meta">
          <span class="tool-tag tag-free" id="toolTag">🆓 免费</span>
          <span class="tool-tag" style="background:#f3f4f6;color:#6b7280;" id="toolCount">0人玩过</span>
        </div>
      </div>
      <div class="form-card">
        <div class="form-card-title">✏️ 填写参数</div>
        <div id="toolForm"></div>
        <button class="btn-generate" id="generateBtn" onclick="generate()">✨ 开始生成</button>
      </div>
    </div>

    <!-- 结果页 -->
    <div id="pageResult" class="result-page">
      <div class="back-btn" onclick="goBack()">← 返回</div>
      <div class="result-card">
        <div class="result-title" id="resultTitle">生成结果</div>
        <div class="result-content" id="resultContent"></div>
        <div class="result-actions">
          <button class="btn-action" onclick="copyResult()">📋 复制</button>
          <button class="btn-action" onclick="regenerate()">🔄 重新生成</button>
        </div>
      </div>
    </div>

    <!-- 加载状态 -->
    <div id="loadingState" class="loading hidden">
      <div class="loading-icon">⏳</div>
      <div>加载中...</div>
    </div>

    <!-- 错误状态 -->
    <div id="errorState" class="error hidden">
      <div class="loading-icon">😢</div>
      <div id="errorMsg">加载失败</div>
      <button class="retry-btn" onclick="retryLoad()">重新加载</button>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab-item active" onclick="switchTab('home')">
      <span class="tab-icon">🏠</span><span>工具箱</span>
    </div>
    <div class="tab-item" onclick="switchTab('profile')">
      <span class="tab-icon">👤</span><span>我的</span>
    </div>
  </div>

  <!-- 小程序码弹窗 -->
  <div class="modal-overlay" id="miniprogramModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeMiniProgramQR()">×</button>
      <div class="modal-title">📱 微信搜索「不正经工具箱」</div>
      <div class="modal-desc">
        小程序版功能更完整<br>
        支持微信登录、看广告解锁VIP工具
      </div>
      <div class="qrcode-placeholder" style="padding:0;overflow:hidden;">
        <img src="images/miniprogram-qrcode.jpg" alt="小程序码" style="width:100%;height:100%;object-fit:cover;">
      </div>
      <div style="font-size:14px;color:var(--text);font-weight:600;margin-bottom:8px;">
        或直接在微信搜索
      </div>
      <div style="padding:12px;background:linear-gradient(135deg,#f3f4f6,#e5e7eb);border-radius:12px;font-size:16px;font-weight:700;color:var(--primary);">
        不正经工具箱
      </div>
      <div class="modal-tips">
        💡 小程序版优势：<br>
        • 微信一键登录，数据云端同步<br>
        • 看广告免费解锁VIP工具<br>
        • 每日免费次数 + 赠送次数
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    let userId = localStorage.getItem('userId') || null;
    let currentCat = 'all';
    let currentTool = null;
    let currentResult = null;
    let formData = {};
    const state = { userInfo: null };

    const ICON_PATHS = {
      1:'images/tool-1.jpg',2:'images/tool-2.jpg',3:'images/tool-3.jpg',
      4:'images/tool-4.jpg',5:'images/tool-5.jpg',6:'images/tool-6.jpg',
      7:'images/tool-7.jpg',8:'images/tool-8.jpg',9:'images/tool-9.jpg',
      10:'images/tool-10.jpg',11:'images/tool-11.jpg',12:'images/tool-12.jpg',
      13:'images/tool-13.jpg',14:'images/tool-14.jpg',15:'images/tool-15.jpg',
      16:'images/tool-16.jpg',17:'images/tool-17.jpg'
    };

    const BGS = [
      'linear-gradient(135deg,#ff6b9d,#ff8e53)',
      'linear-gradient(135deg,#a855f7,#ec4899)',
      'linear-gradient(135deg,#06b6d4,#3b82f6)',
      'linear-gradient(135deg,#10b981,#06b6d4)'
    ];

    async function init() {
      // 检查URL参数（微信登录回调）
      const urlParams = new URLSearchParams(window.location.search);
      const wechatLoginSuccess = urlParams.get('wechat_login');
      const wechatUserId = urlParams.get('userId');
      const errorMsg = urlParams.get('msg');

      if (wechatLoginSuccess && wechatUserId) {
        userId = wechatUserId;
        localStorage.setItem('userId', userId);
        // 清除URL参数
        window.history.replaceState({}, document.title, '/');
      } else if (errorMsg) {
        alert('微信登录失败：' + decodeURIComponent(errorMsg));
      }

      await login();
      await loadTools();
      await loadUserInfo();
      updateLoginUI();
    }

    async function login() {
      if (!userId) {
        const code = 'h5_' + Date.now() + Math.random().toString(36).slice(2,8);
        const res = await api('/user/login', 'POST', { code, nickname: 'H5用户', avatar: '😀' });
        if (res.code === 0) {
          userId = res.data.userId;
          localStorage.setItem('userId', userId);
        }
      }
    }

    async function wechatLogin() {
      try {
        const res = await api('/user/h5-wechat-auth-url', 'GET');
        if (res.code === 0 && res.data.authUrl) {
          // 跳转到微信授权页面
          window.location.href = res.data.authUrl;
        } else {
          // 未配置微信H5登录，使用快捷登录

    async function generate() {
      if (!currentTool) return;

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.textContent = '⏳ 生成中...';

      try {
        // 创建订单
        const createRes = await api('/order/create', 'POST', {
          toolId: currentTool.id,
          userId: userId,
          inputParams: formData,
          useFree: true
        });

        if (createRes.code !== 0) {
          alert(createRes.message || '创建订单失败');
          return;
        }

        const orderId = createRes.data.orderId;

        // 支付订单（免费订单自动成功）
        const payRes = await api('/order/pay', 'POST', {
          orderId: orderId,
          userId: userId
        });

        if (payRes.code !== 0) {
          alert(payRes.message || '生成失败');
          return;
        }

        // 显示结果
        currentResult = payRes.data.result;
        showResult(currentResult);

      } catch (err) {
        alert('网络错误，请重试');
      } finally {
        btn.disabled = false;
        btn.textContent = '✨ 开始生成';
      }
    }

    function showResult(result) {
      document.getElementById('resultTitle').textContent = currentTool.name + ' - 生成结果';

      const contentDiv = document.getElementById('resultContent');
      contentDiv.innerHTML = '';

      if (typeof result === 'string') {
        // 尝试解析字符串格式的结果
        const parsed = parseStringResult(result);
        if (parsed) {
          renderParsedResult(parsed, contentDiv);
        } else {
          // 纯文本，整块显示
          contentDiv.innerHTML = `<div class="result-item"><div class="result-item-text">${result}</div><button class="btn-copy-item" onclick="copyText(this)">📋 复制</button></div>`;
        }
      } else if (typeof result === 'object') {
        renderParsedResult(result, contentDiv);
      } else {
        contentDiv.textContent = JSON.stringify(result, null, 2);
      }

      showPage('result');
    }

    function parseStringResult(str) {
      // 尝试解析 "key:\n  1. item1\n  2. item2" 格式
      const lines = str.split('\n');
      const result = {};
      let currentKey = null;
      let currentArray = [];

      for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        // 检查是否是 "key:" 格式
        const keyMatch = line.match(/^(\w+):\s*$/);
        if (keyMatch) {
          if (currentKey && currentArray.length > 0) {
            result[currentKey] = currentArray;
          }
          currentKey = keyMatch[1];
          currentArray = [];
          continue;
        }

        // 检查是否是 "  1. item" 格式
        const itemMatch = line.match(/^\d+\.\s*(.+)$/);
        if (itemMatch && currentKey) {
          currentArray.push(itemMatch[1]);
          continue;
        }

        // 检查是否是 "key: value" 格式
        const kvMatch = line.match(/^(\w+):\s*(.+)$/);
        if (kvMatch) {
          if (currentKey && currentArray.length > 0) {
            result[currentKey] = currentArray;
            currentArray = [];
          }
          result[kvMatch[1]] = kvMatch[2];
          currentKey = null;
        }
      }

      if (currentKey && currentArray.length > 0) {
        result[currentKey] = currentArray;
      }

      return Object.keys(result).length > 0 ? result : null;
    }

    function renderParsedResult(result, container) {
      Object.entries(result).forEach(([key, value]) => {
        if (Array.isArray(value)) {
          // 数组类型：每条单独显示+复制按钮
          const section = document.createElement('div');
          section.className = 'result-section';
          section.innerHTML = `<div class="result-section-title">${key}</div>`;

          value.forEach((item, index) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'result-item';

            let text = '';
            if (typeof item === 'string') {
              text = item;
            } else if (typeof item === 'object' && item !== null) {
              text = Object.entries(item).map(([k, v]) => {
                if (k === 'text' || k === 'name' || k === 'content') return v;
                return `${k}: ${v}`;
              }).filter(Boolean).join(' | ');
            } else {
              text = String(item);
            }

            itemDiv.innerHTML = `
              <div class="result-item-index">${index + 1}</div>
              <div class="result-item-text">${text}</div>
              <button class="btn-copy-item" onclick="copyText(this)">📋</button>
            `;
            section.appendChild(itemDiv);
          });

          container.appendChild(section);
        } else if (typeof value === 'object' && value !== null) {
          const section = document.createElement('div');
          section.className = 'result-section';
          section.innerHTML = `
            <div class="result-section-title">${key}</div>
            <div class="result-item">
              <div class="result-item-text">${JSON.stringify(value, null, 2)}</div>
              <button class="btn-copy-item" onclick="copyText(this)">📋</button>
            </div>
          `;
          container.appendChild(section);
        } else {
          // 简单值
          const section = document.createElement('div');
          section.className = 'result-section';
          section.innerHTML = `
            <div class="result-section-title">${key}</div>
            <div class="result-item">
              <div class="result-item-text">${value}</div>
              <button class="btn-copy-item" onclick="copyText(this)">📋</button>
            </div>
          `;
          container.appendChild(section);
        }
      });
    }

    function copyText(btn) {
      const itemDiv = btn.closest('.result-item');
      const textDiv = itemDiv.querySelector('.result-item-text');
      const text = textDiv.textContent;

      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => { btn.textContent = originalText; }, 1500);
      }).catch(() => {
        // 降级方案
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);

        const originalText = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => { btn.textContent = originalText; }, 1500);
      });
    }

    function copyResult() {
      const content = document.getElementById('resultContent').textContent;
      navigator.clipboard.writeText(content).then(() => {
        alert('已复制到剪贴板');
      }).catch(() => {
        alert('复制失败，请手动复制');
      });
    }

    function regenerate() {
      if (currentTool) {
        generate();
      }
    }

    function showPage(page) {
      document.querySelectorAll('.page, .tool-detail, .result-page').forEach(p => {
        p.classList.remove('active');
      });

      if (page === 'home') {
        document.getElementById('pageHome').classList.add('active');
      } else if (page === 'tool') {
        document.getElementById('pageTool').classList.add('active');
      } else if (page === 'result') {
        document.getElementById('pageResult').classList.add('active');
      }

      window.scrollTo(0, 0);
    }

    function goHome() {
      showPage('home');
    }

    function goBack() {
      if (currentTool) {
        showPage('tool');
      } else {
        showPage('home');
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      event.currentTarget.classList.add('active');

      if (tab === 'home') {
        showPage('home');
      } else if (tab === 'profile') {
        alert('个人中心功能开发中，请使用小程序体验完整功能');
      }
    }

    async function api(path, method, data) {
      const url = API_BASE + path;
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (method === 'GET' && data) {
        const qs = new URLSearchParams(data).toString();
        const res = await fetch(url + '?' + qs, opts);
        return res.json();
      }
      if (data) opts.body = JSON.stringify(data);
      const res = await fetch(url, opts);
      return res.json();
    }

    // 初始化
    init();
  </script>
